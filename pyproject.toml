[project]
name = "expense-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "raushanpatelpatel87-source", email = "raushanpatelpatel87@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "mysql-connector-python>=26.7.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.0.1",
    "werkzeug>=3.1.9",
]

[project.scripts]
expense-tracker = "expense_tracker:main"
        
[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pyrefly]
search-path = ["."]

[tool.pyright]
extraPaths = ["."]
