{% extends "base.html" %}
{% block title %}Login - Expense Tracker{% endblock %}
{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <div class="brand-mark">₹</div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>ExpenseTracker</h1>
        <p class="muted">Sign in to manage your money.</p>
        {% if error %}<div class="error" id="error-msg">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('login') }}">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>
            <button class="button primary" type="submit" id="login-btn">Log In</button>
        </form>
        <p class="switch-link">Don't have an account? <a href="{{ url_for('register') }}" id="signup-link">Sign Up</a></p>
    </section>
</main>
{% endblock %}
