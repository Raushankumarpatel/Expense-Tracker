{% extends "base.html" %}
{% block title %}Register - Expense Tracker{% endblock %}
{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <div class="brand-mark green">+</div>
        <p class="eyebrow">GET STARTED</p>
        <h1>Create Your Free Account</h1>
        <p class="muted">Build a clearer picture of your spending.</p>
        {% if error %}<div class="error" id="error-msg">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('register') }}">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="{{ name or '' }}" placeholder="Your name" required>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
            <button class="button primary green-button" type="submit" id="signup-btn">Create Account</button>
        </form>
        <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}" id="login-link">Log In</a></p>
    </section>
</main>
{% endblock %}
